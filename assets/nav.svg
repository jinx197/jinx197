<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <filter id="neonMagenta">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,17 60,35 30,52 0,35 0,17" fill="none" stroke="#FF00FF" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="120" rx="4" fill="url(#bgGrad)" stroke="#FF00FF" stroke-width="0.5" opacity="0.95"/>
  <rect width="800" height="120" rx="4" fill="url(#hex)"/>

  <!-- 终端排列命令 -->
  <text x="400" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#888">
    $ ssh -L 8080:localhost:3000 jinx197@grid.net <span style="fill:#00FF00;">// ACCESS GRANTED</span>
  </text>

  <!-- 故障效果链接 -->
  <text x="395" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)">
    [COMMS]  [PROJECTS]  [CONTACT]  [PGP_KEY]
  </text>
  <text x="403" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F0FF" opacity="0.1">
    [COMMS]  [PROJECTS]  [CONTACT]  [PGP_KEY]
  </text>

  <!-- 底部电路装饰 -->
  <path d="M 50 95 L 80 95 L 90 85 L 120 85" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.15"/>
  <circle cx="50" cy="95" r="2" fill="#00F0FF" opacity="0.15"/>
  <circle cx="120" cy="85" r="2" fill="#00F0FF" opacity="0.15"/>

  <path d="M 680 85 L 710 85 L 720 95 L 750 95" fill="none" stroke="#FF00FF" stroke-width="0.5" opacity="0.12"/>
  <circle cx="680" cy="85" r="2" fill="#FF00FF" opacity="0.12"/>
  <circle cx="750" cy="95" r="2" fill="#FF00FF" opacity="0.12"/>

  <!-- 随机噪声点 -->
  <rect x="200" y="75" width="3" height="1" fill="#FFCC00" opacity="0.1"/>
  <rect x="550" y="80" width="2" height="1" fill="#00F0FF" opacity="0.08"/>
  <rect x="600" y="72" width="4" height="1" fill="#FF00FF" opacity="0.06"/>
</svg>
