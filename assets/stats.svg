<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <filter id="neonCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonMagenta" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonYellow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 网格 -->
    <pattern id="gridMajor" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="none"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#00F0FF" stroke-width="0.3" opacity="0.12"/>
      <line x1="80" y1="0" x2="80" y2="40" stroke="#00F0FF" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <pattern id="gridMinor" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="none"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#FF00FF" stroke-width="0.15" opacity="0.06"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="barMagenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF00FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="barYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="200" rx="4" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="0.5" opacity="0.95"/>
  <rect width="400" height="200" rx="4" fill="url(#gridMajor)"/>
  <rect width="400" height="200" rx="4" fill="url(#gridMinor)"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="400" height="24" rx="4" fill="rgba(0,240,255,0.06)"/>
  <rect x="0" y="20" width="400" height="4" fill="rgba(0,240,255,0.06)"/>
  <text x="12" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)" opacity="0.9">█ GITHUB_STATS.dmp</text>
  <text x="380" y="16" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#888">NODE::JINX197</text>

  <!-- 左侧柱状图 -->
  <text x="25" y="185" font-family="'Courier New', monospace" font-size="8" fill="#888">REPOS</text>
  <text x="85" y="185" font-family="'Courier New', monospace" font-size="8" fill="#888">STARS</text>
  <text x="145" y="185" font-family="'Courier New', monospace" font-size="8" fill="#888">COMMITS</text>

  <!-- 柱状图 - REPOS (霓虹青) -->
  <rect x="20" y="170" width="30" height="0" fill="url(#barCyan)" rx="1" opacity="0.85"/>
  <rect x="20" y="168" width="30" height="2" fill="#00F0FF" rx="1" opacity="0.9" filter="url(#neonCyan)"/>

  <!-- 柱状图 - STARS (霓虹洋红) -->
  <rect x="80" y="170" width="30" height="0" fill="url(#barMagenta)" rx="1" opacity="0.85"/>
  <rect x="80" y="168" width="30" height="2" fill="#FF00FF" rx="1" opacity="0.9" filter="url(#neonMagenta)"/>

  <!-- 柱状图 - COMMITS (霓虹黄) -->
  <rect x="140" y="170" width="30" height="0" fill="url(#barYellow)" rx="1" opacity="0.85"/>
  <rect x="140" y="168" width="30" height="2" fill="#FFCC00" rx="1" opacity="0.9" filter="url(#neonYellow)"/>

  <!-- 右侧数据面板 -->
  <rect x="210" y="35" width="180" height="160" fill="rgba(0,0,0,0.3)" rx="2" stroke="rgba(255,0,255,0.15)" stroke-width="0.5"/>

  <!-- 数据行 -->
  <text x="220" y="55" font-family="'Courier New', monospace" font-size="10" fill="#FF00FF">[CONTRIBUTIONS]</text>
  <text x="380" y="55" text-anchor="end" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)">1,337</text>

  <line x1="220" y1="62" x2="380" y2="62" stroke="rgba(255,0,255,0.15)" stroke-width="0.5"/>

  <text x="220" y="82" font-family="'Courier New', monospace" font-size="10" fill="#00F0FF">[PUBLIC_REPOS]</text>
  <text x="380" y="82" text-anchor="end" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FFCC00" filter="url(#neonYellow)">42</text>

  <line x1="220" y1="89" x2="380" y2="89" stroke="rgba(0,240,255,0.1)" stroke-width="0.5"/>

  <text x="220" y="109" font-family="'Courier New', monospace" font-size="10" fill="#FFCC00">[FOLLOWERS]</text>
  <text x="380" y="109" text-anchor="end" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)">256</text>

  <line x1="220" y1="116" x2="380" y2="116" stroke="rgba(255,204,0,0.1)" stroke-width="0.5"/>

  <text x="220" y="136" font-family="'Courier New', monospace" font-size="10" fill="#00FF00">[STARS_EARNED]</text>
  <text x="380" y="136" text-anchor="end" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FF00" filter="url(#neonYellow)">892</text>

  <!-- 混乱元素：数据破损/偏移 -->
  <rect x="370" y="73" width="12" height="3" fill="#FF00FF" opacity="0.15"/>
  <rect x="340" y="100" width="8" height="2" fill="#00F0FF" opacity="0.1"/>
  <rect x="365" y="128" width="10" height="2" fill="#FFCC00" opacity="0.1"/>
</svg>
