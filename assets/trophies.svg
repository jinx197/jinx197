<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <filter id="neonCyan">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonMagenta">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none"/>
      <line x1="0" y1="50" x2="50" y2="50" stroke="#00F0FF" stroke-width="0.2" opacity="0.06"/>
      <line x1="50" y1="0" x2="50" y2="50" stroke="#FF00FF" stroke-width="0.2" opacity="0.06"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="180" rx="4" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="0.5" opacity="0.95"/>
  <rect width="800" height="180" rx="4" fill="url(#grid)"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="800" height="22" rx="4" fill="rgba(0,240,255,0.05)"/>
  <text x="12" y="15" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)" opacity="0.9">█ TROPHY.MATRIX // NODE::JINX197</text>

  <!-- 成就卡片网格 2行 x 4列 -->
  <!-- 第1行 -->
  <g transform="translate(20, 40)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(0,240,255,0.15)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00F0FF">OPEN_SOURCE</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)">SENIOR</text>
    <rect x="3" y="45" width="169" height="2" fill="#00F0FF" opacity="0.3"/>
  </g>
  <g transform="translate(210, 40)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(255,0,255,0.15)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#FF00FF">COMMITS</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)">1K CLUB</text>
    <rect x="3" y="45" width="169" height="2" fill="#FF00FF" opacity="0.3"/>
  </g>
  <g transform="translate(400, 40)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(255,204,0,0.15)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#FFCC00">STARGAZER</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFCC00">GOLD</text>
    <rect x="3" y="45" width="169" height="2" fill="#FFCC00" opacity="0.3"/>
  </g>
  <g transform="translate(590, 40)">
    <rect width="190" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(0,255,0,0.15)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00FF00">AUTOMATION</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FF00">GITHUB_OPS</text>
    <rect x="3" y="45" width="184" height="2" fill="#00FF00" opacity="0.3"/>
  </g>

  <!-- 第2行 -->
  <g transform="translate(20, 105)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(255,0,255,0.1)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#FF00FF">PR_REVIEW</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)">EXPERT</text>
    <rect x="3" y="45" width="169" height="2" fill="#FF00FF" opacity="0.2"/>
  </g>
  <g transform="translate(210, 105)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(0,240,255,0.1)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00F0FF">DEPLOY</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)">CI_MASTER</text>
    <rect x="3" y="45" width="169" height="2" fill="#00F0FF" opacity="0.2"/>
  </g>
  <g transform="translate(400, 105)">
    <rect width="175" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(255,204,0,0.1)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#FFCC00">DOCUMENT</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFCC00">SAGE</text>
    <rect x="3" y="45" width="169" height="2" fill="#FFCC00" opacity="0.2"/>
  </g>
  <g transform="translate(590, 105)">
    <rect width="190" height="50" fill="rgba(0,0,0,0.4)" rx="3" stroke="rgba(0,255,0,0.1)" stroke-width="0.5"/>
    <text x="10" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00FF00">BUG_HUNTER</text>
    <text x="10" y="38" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00FF00">NIGHTMARE</text>
    <rect x="3" y="45" width="184" height="2" fill="#00FF00" opacity="0.2"/>
  </g>
</svg>
