<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" shape-rendering="crispEdges">
  <defs>
    <!-- CRT 扫描线 -->
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(0,0,0,0.18)"/>
    </pattern>
    <!-- 像素网格 -->
    <pattern id="pxgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="7" height="7" fill="none" stroke="rgba(0,240,255,0.04)" stroke-width="0.5"/>
    </pattern>
    <!-- 霓虹滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- CRT 外壳 -->
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0a0a0e" stroke="#1a1a2e" stroke-width="4"/>
  <rect x="8" y="8" width="784" height="404" rx="4" fill="#0c0c14"/>

  <!-- 像素网格背景 -->
  <rect x="8" y="8" width="784" height="404" rx="4" fill="url(#pxgrid)"/>
  <!-- 扫描线 -->
  <rect x="8" y="8" width="784" height="404" rx="4" fill="url(#scan)"/>

