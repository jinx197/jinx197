<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <filter id="neonCyan">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonMagenta">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="none"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#00F0FF" stroke-width="0.2" opacity="0.1"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#FF00FF" stroke-width="0.2" opacity="0.1"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" rx="4" fill="url(#bgGrad)" stroke="#FF00FF" stroke-width="0.5" opacity="0.95"/>
  <rect width="400" height="200" rx="4" fill="url(#grid)"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="400" height="24" rx="4" fill="rgba(255,0,255,0.06)"/>
  <rect x="0" y="20" width="400" height="4" fill="rgba(255,0,255,0.06)"/>
  <text x="12" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)" opacity="0.9">█ NEURAL.SCAN</text>

  <!-- 语言条形图 -->
  <text x="20" y="50" font-family="'Courier New', monospace" font-size="9" fill="#00F0FF">PYTHON</text>
  <rect x="95" y="42" width="200" height="10" fill="rgba(0,240,255,0.1)" rx="2"/>
  <rect x="95" y="42" width="160" height="10" fill="#00F0FF" rx="2" opacity="0.8" filter="url(#neonCyan)"/>
  <text x="340" y="51" font-family="'Courier New', monospace" font-size="9" fill="#00F0FF">40%</text>

  <text x="20" y="72" font-family="'Courier New', monospace" font-size="9" fill="#FF00FF">TYPESCRIPT</text>
  <rect x="95" y="64" width="200" height="10" fill="rgba(255,0,255,0.1)" rx="2"/>
  <rect x="95" y="64" width="120" height="10" fill="#FF00FF" rx="2" opacity="0.8" filter="url(#neonMagenta)"/>
  <text x="340" y="73" font-family="'Courier New', monospace" font-size="9" fill="#FF00FF">30%</text>

  <text x="20" y="94" font-family="'Courier New', monospace" font-size="9" fill="#FFCC00">RUST</text>
  <rect x="95" y="86" width="200" height="10" fill="rgba(255,204,0,0.1)" rx="2"/>
  <rect x="95" y="86" width="60" height="10" fill="#FFCC00" rx="2" opacity="0.8"/>
  <text x="340" y="95" font-family="'Courier New', monospace" font-size="9" fill="#FFCC00">15%</text>

  <text x="20" y="116" font-family="'Courier New', monospace" font-size="9" fill="#00FF00">GO</text>
  <rect x="95" y="108" width="200" height="10" fill="rgba(0,255,0,0.1)" rx="2"/>
  <rect x="95" y="108" width="40" height="10" fill="#00FF00" rx="2" opacity="0.8"/>
  <text x="340" y="117" font-family="'Courier New', monospace" font-size="9" fill="#00FF00">10%</text>

  <text x="20" y="138" font-family="'Courier New', monospace" font-size="9" fill="#888">OTHER</text>
  <rect x="95" y="130" width="200" height="10" fill="rgba(136,136,136,0.1)" rx="2"/>
  <rect x="95" y="130" width="20" height="10" fill="#888" rx="2" opacity="0.6"/>
  <text x="340" y="139" font-family="'Courier New', monospace" font-size="9" fill="#888">5%</text>

  <!-- 散落混乱元素 -->
  <rect x="240" y="80" width="6" height="1" fill="#FF00FF" opacity="0.15"/>
  <rect x="180" y="95" width="4" height="1" fill="#00F0FF" opacity="0.12"/>
  <rect x="310" y="60" width="5" height="1" fill="#FFCC00" opacity="0.1"/>

  <!-- 底部六边形图案 -->
  <polygon points="50,160 65,168 65,184 50,192 35,184 35,168" fill="none" stroke="#00F0FF" stroke-width="0.4" opacity="0.15"/>
  <polygon points="130,160 145,168 145,184 130,192 115,184 115,168" fill="none" stroke="#FF00FF" stroke-width="0.4" opacity="0.12"/>
  <polygon points="290,160 305,168 305,184 290,192 275,184 275,168" fill="none" stroke="#FFCC00" stroke-width="0.4" opacity="0.1"/>
</svg>
