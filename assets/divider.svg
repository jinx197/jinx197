<svg xmlns="http://www.w3.org/2000/svg" width="800" height="20" viewBox="0 0 800 20">
  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="20" fill="none"/>
  <!-- 霓虹线 -->
  <line x1="0" y1="10" x2="350" y2="10" stroke="#00F0FF" stroke-width="1" filter="url(#neon)" opacity="0.5"/>
  <line x1="450" y1="10" x2="800" y2="10" stroke="#00F0FF" stroke-width="1" filter="url(#neon)" opacity="0.5"/>
  <!-- 中心菱形 -->
  <polygon points="380,10 400,5 420,10 400,15" fill="#00F0FF" filter="url(#neon)" opacity="0.8"/>
  <polygon points="385,10 400,7 415,10 400,13" fill="#0D1117"/>
  <circle cx="400" cy="10" r="2" fill="#FF00FF"/>
  <!-- 断裂效果 -->
  <rect x="348" y="9" width="4" height="2" fill="#0D1117"/>
  <rect x="448" y="9" width="4" height="2" fill="#0D1117"/>
</svg>
