<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="0 0 300 80">
  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="80" rx="4" fill="url(#bgGrad)" stroke="#FF00FF" stroke-width="0.5" opacity="0.95"/>

  <!-- 扫描线 -->
  <line x1="0" y1="15" x2="300" y2="15" stroke="#FF00FF" stroke-width="0.3" opacity="0.15"/>
  <line x1="0" y1="35" x2="300" y2="35" stroke="#FF00FF" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="55" x2="300" y2="55" stroke="#FF00FF" stroke-width="0.3" opacity="0.08"/>

  <text x="150" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#FF00FF" filter="url(#neon)">SIGNAL_DETECTED</text>
  <text x="150" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#00F0FF" filter="url(#neon)">NX_1337</text>
  <text x="155" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#FF00FF" opacity="0.1">NX_1337</text>

  <!-- 故障点 -->
  <rect x="270" y="10" width="2" height="2" fill="#FFCC00" opacity="0.15"/>
  <rect x="25" y="65" width="3" height="1" fill="#00F0FF" opacity="0.12"/>
</svg>
