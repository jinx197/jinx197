<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <filter id="neonCyan">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonMagenta">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonYellow">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none"/>
      <line x1="0" y1="30" x2="30" y2="30" stroke="#00F0FF" stroke-width="0.2" opacity="0.08"/>
      <line x1="30" y1="0" x2="30" y2="30" stroke="#FF00FF" stroke-width="0.2" opacity="0.08"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="200" rx="4" fill="url(#bgGrad)" stroke="#FFCC00" stroke-width="0.5" opacity="0.95"/>
  <rect width="400" height="200" rx="4" fill="url(#grid)"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="400" height="24" rx="4" fill="rgba(255,204,0,0.06)"/>
  <text x="12" y="16" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFCC00" filter="url(#neonYellow)" opacity="0.9">█ STREAK.ANALYZER</text>

  <!-- 大数字 - 当前连胜 -->
  <text x="200" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#00F0FF" filter="url(#neonCyan)">42</text>
  <text x="205" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#FF00FF" opacity="0.12">42</text>
  <text x="200" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#FF00FF" filter="url(#neonMagenta)">DAY STREAK</text>

  <!-- 最长连胜 -->
  <text x="80" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FFCC00" filter="url(#neonYellow)">128</text>
  <text x="80" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">LONGEST</text>

  <!-- 总贡献 -->
  <text x="200" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00FF00">4,096</text>
  <text x="200" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">TOTAL CONTRIB</text>

  <!-- 混乱装饰 -->
  <text x="320" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#FF00FF" filter="url(#neonMagenta)">∞</text>
  <text x="320" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#888">POTENTIAL</text>

  <!-- 底部波形线 -->
  <polyline points="30,175 60,170 90,178 120,165 150,180 180,172 210,168 240,175 270,170 300,178 330,165 360,172 390,168" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.3"/>
  <polyline points="30,175 60,170 90,178 120,165 150,180 180,172 210,168 240,175 270,170 300,178 330,165 360,172 390,168" fill="none" stroke="#FF00FF" stroke-width="0.4" opacity="0.15" transform="translate(2, -1)"/>
</svg>
